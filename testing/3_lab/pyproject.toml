[project]
name = "lab3"
version = "0.1.0"
description = "Third testing lab project"
authors = [
    {name = "BobasB"}
]
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
]

[tool.poetry]
packages = [{include = "lab3", from = "src"}]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "pytest (>=9.1.1,<10.0.0)",
    "coverage (>=7.17.0,<8.0.0)"
]

[tool.coverage.run]
source = ["src/lab3"]
branch = true

[tool.coverage.report]
skip_empty = true
omit = [
    "test_*.py",
    "*/tests/*",
    "*/__init__.py",
    "*/.venv/*"
]
exclude_lines = [
"def lambda_handler",
'if __name__ == .__main__.:',
"def main",
"from main import main"
]
fail_under = 90 # поріг або межа покриття, нижче якої тестування вважається проваленим
