[project]
name = "1-lab"
version = "0.1.0"
description = "Створюємо проект для тестування"
authors = [
    {name = "BobasB",email = "bugil.bogdan@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
]

[dependency-groups]
dev = [
    "black (>=26.5.1,<27.0.0)",
    "pytest (>=9.1.1,<10.0.0)"
]

[tool.pytest.ini_options]
markers = [
    "unit: isolated tests of a single unit of behavior",
    "card_game: general CardGame example tests",
    "game_initialization: tests for CardGame construction and attributes",
    "card_attributes: tests for card attributes",
    "card_combat: tests for card combat behavior",
    "input_validation: tests for validating interaction arguments",
    "input_handling: tests for handling user input",
    "comparison: tests for comparing input arguments",
    "uses_fixtures: tests that use pytest fixtures",
    "parameterized: tests executed with multiple parameter sets",
]

[tool.poetry]
packages = [{ include = "lab1", from = "src" }]

[tool.poetry.scripts]
game = "lab1.game:main"
test = "tests.test_game:test_card_game"


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
