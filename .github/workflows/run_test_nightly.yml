# Окремий воркфлоу для запуску інтеграційних тестів у нічний час, 
# щоб не блокувати основні тести під час розробки.
name: "Запуск Нічних тестів"
run-name: "Запуск нічних інтеграційних тестів ${{ github.event_name }}"
description: "Запуск інтеграційних тестів у нічний час"

on:
    schedule:
        - cron: '15 0 * * *' # Запуск щодня о 00:00 UTC
    workflow_dispatch:
        inputs:
            run_integration_tests:
                description: 'Вибіркове значення для запуску інтеграційних тестів'
                required: true
                default: 'warning'
                type: choice
                options:
                  - info
                  - warning
                  - debug

jobs:
    run_integraation_tests:
        name: "Запуск інтеграційних тестів"
        runs-on: ubuntu-latest
        steps:
            - name: Start
              run: |
                echo "Запуск інтеграційних тестів: ${{ github.event.inputs.run_integration_tests }}" >> $GITHUB_STEP_SUMMARY
            - name: Checkout repository
              uses: actions/checkout@v4
            - name: Setup Python
              uses: actions/setup-python@v7
              with:
                  python-version: '3.13'
            - name: Cache Poetry dependencies
              uses: actions/cache@v3
              with:
                path: |
                  ~/.cache/pypoetry
                  ~/.cache/pip
                key: ${{ runner.os }}-poetry
            - name: Install Poetry
              run: |
                curl -sSL https://install.python-poetry.org | python3 - 
            - name: "Встановлюємо залежності"
              working-directory: "./testing/3_lab"
              run: |
                poetry install
            - name: "Запускаємо тести Pytest"
              working-directory: "./testing/4_lab/integration"
              run: |
                poetry run pytest -v