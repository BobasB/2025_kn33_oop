name: "Запуск тестів на Лабораторній роботі 1"

on:
  push:

jobs:
  run_test_lab_1:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        lab_dir: ["./testing/1_lab", "./testing/2_lab"]
    steps:
        - name: Checkout repository
          uses: actions/checkout@v4
        - name: Setup Python
          uses: actions/setup-python@v7
          with:
              python-version: '3.13'
        - name: Cache Poetry dependencies
          uses: actions/cache@v3
          with:
            path: |
              ~/.cache/pypoetry
              ~/.cache/pip
            key: ${{ runner.os }}-poetry
        - name: Install Poetry
          run: |
            curl -sSL https://install.python-poetry.org | python3 - 
        - name: "Встановлюємо залежності"
          working-directory: ${{ matrix.lab_dir }}
          run: |
            poetry install
        - name: "Запускаємо тести"
          working-directory: ${{ matrix.lab_dir }}
          run: |
            poetry run python -m unittest -v
  
  run_test_lab_2:
    runs-on: ubuntu-latest
    needs: run_test_lab_1
    steps:
        - name: Checkout repository
          uses: actions/checkout@v4
  
  run_test_lab_3:
    runs-on: ubuntu-latest
    steps:
        - name: Checkout repository
          uses: actions/checkout@v4
  
  run_test_lab_4:
    runs-on: ubuntu-latest
    steps:
        - name: Checkout repository
          uses: actions/checkout@v4
